<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6a7d">
<meta name="description" content="包装課の生産予定時間・終了時刻予測・受入質量残量の計算">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生産時間計算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>生産時間・残量計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 1カラムの作業カード。各画面は「結果（琥珀）」→「入力（青）」の順。生産予定は下部に終了時刻バー */
:root {
  --bg: #eef1f0; --surface: #ffffff; --ink: #17262b; --muted: #5d6f75; --line: #d3dcde;
  --accent: #0f6a7d; --accent-ink: #ffffff; --accent-soft: #dcecef;
  --in-bg: #e8f1fb; --in-line: #8fb2d3; --in-ink: #0f3557; --in-focus: #1f6fb8;
  --out-bg: #fbf3e2; --out-line: #e3c785; --out-ink: #563a05; --out-strong: #3b2700;
  --ok: #2c7a4b; --ok-bg: #e4f3ea; --warn: #9a5b00; --warn-bg: #fff1d6; --err: #b42318; --err-bg: #fde8e6;
  --shadow: 0 1px 2px rgba(20,40,45,.08);
  --f-ui: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171a; --surface: #162227; --ink: #e3ecee; --muted: #96a8ae; --line: #2b3c42;
  --accent: #4fb3c8; --accent-ink: #06242b; --accent-soft: #173840;
  --in-bg: #12283b; --in-line: #3d6d96; --in-ink: #cfe4fa; --in-focus: #6fb0ec;
  --out-bg: #2a2214; --out-line: #6e5626; --out-ink: #efd6a0; --out-strong: #ffe9b8;
  --ok: #6fd19a; --ok-bg: #12301f; --warn: #f0b45a; --warn-bg: #33240b; --err: #ff8a7f; --err-bg: #3a1512;
  --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f171a; --surface: #162227; --ink: #e3ecee; --muted: #96a8ae; --line: #2b3c42;
  --accent: #4fb3c8; --accent-ink: #06242b; --accent-soft: #173840;
  --in-bg: #12283b; --in-line: #3d6d96; --in-ink: #cfe4fa; --in-focus: #6fb0ec;
  --out-bg: #2a2214; --out-line: #6e5626; --out-ink: #efd6a0; --out-strong: #ffe9b8;
  --ok: #6fd19a; --ok-bg: #12301f; --warn: #f0b45a; --warn-bg: #33240b; --err: #ff8a7f; --err-bg: #3a1512;
  --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--in-focus); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* header + tabs */
.top { background: var(--surface); }
.top .wrap { padding-block: 12px 4px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.top h1 { font-size: 19px; letter-spacing: .02em; }
.saved { display: block; font-size: 12px; color: var(--muted); }
.saved b { color: var(--ok); font-weight: 700; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; }
.tab { flex: 1 1 0; min-width: 0; padding: 12px 4px 10px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 15px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

main.wrap { padding-block: 16px 110px; }
.panel { display: grid; gap: 14px; }

/* buttons */
.btn { min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-style: dashed; color: var(--muted); }
.btn.danger { color: var(--err); }
.btn.sm { min-height: 38px; padding: 4px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--out-ink); cursor: pointer; min-height: 32px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

/* hero (計算結果) */
.hero { background: var(--out-bg); border: 1.5px solid var(--out-line); border-radius: 16px; padding: 14px 16px 12px; color: var(--out-ink); display: grid; gap: 8px; box-shadow: var(--shadow); }
.hero .hhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero .hk { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.hero .hv { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 46px; line-height: 1.1; color: var(--out-strong); overflow-wrap: anywhere; }
.hero .hv small { font-family: var(--f-ui); font-size: 18px; font-weight: 700; margin-left: 4px; }
.hero .hv .pre { font-family: var(--f-ui); font-size: 22px; font-weight: 700; margin-right: 6px; }
.hero .hd { font-size: 14px; }
.hero .hd b { font-family: var(--f-num); }
.hero .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero .pair .hv { font-size: clamp(24px, 7.6vw, 34px); white-space: nowrap; }
.hero .pair .hv small { font-size: 14px; margin-left: 2px; }
.hero .pair > div { min-width: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--out-line); margin-top: 2px; }
.stat { padding: 8px 4px 2px; display: grid; gap: 0; min-width: 0; }
.stat:nth-child(odd) { border-right: 1px solid var(--out-line); padding-right: 10px; }
.stat:nth-child(even) { padding-left: 12px; }
.stat:nth-child(n+3) { border-top: 1px dashed var(--out-line); }
.stat .k { font-size: 12px; font-weight: 700; opacity: .85; }
.stat .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; color: var(--out-strong); overflow-wrap: anywhere; }
.stat .v small { font-family: var(--f-ui); font-size: 12px; margin-left: 3px; }
.stat .d { font-size: 11px; font-family: var(--f-num); opacity: .8; }
.hero.idle { background: var(--surface); border-style: dashed; border-color: var(--line); color: var(--muted); }
.hero.idle .hv { color: var(--muted); }
.hero.err { background: var(--err-bg); border-color: var(--err); color: var(--err); }
.hero.err .hv { color: var(--err); }
.hero.warn { border-color: var(--warn); }
.hero.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.hero.ok .hv { color: var(--ok); }
.alert { font-size: 13px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 6px 10px; }
.base { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--out-line); padding-top: 10px; font-size: 13px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 4px; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.tag.old { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }

/* 入力カード */
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.box > h2 { font-size: 15px; color: var(--muted); letter-spacing: .06em; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; align-content: start; }
.field .lbl { font-size: 13px; font-weight: 700; }
.ctl { display: flex; align-items: stretch; background: var(--in-bg); border: 1.5px solid var(--in-line); border-radius: 10px; overflow: hidden; }
.ctl:focus-within { border-color: var(--in-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--in-focus) 25%, transparent); }
.ctl input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--in-ink); font-family: var(--f-num); font-size: 20px; padding: 8px 10px; min-height: 50px; outline: none; }
.ctl input[type="date"], .ctl input[type="time"] { font-size: 17px; }
.ctl .unit { display: flex; align-items: center; padding: 0 10px; font-size: 13px; color: var(--in-ink); white-space: nowrap; border-left: 1px solid color-mix(in srgb, var(--in-line) 50%, transparent); }
.ctl.big input { font-size: 28px; min-height: 60px; }
.ctl.bad { border-color: var(--err); background: var(--err-bg); }
.err { font-size: 12px; color: var(--err); font-weight: 700; }
.err:empty { display: none; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* 生産の順番 */
.srows { display: grid; gap: 0; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1.25fr) minmax(0, 1fr) 40px; gap: 8px; align-items: end; padding: 10px 0; }
.srow + .srow, .co + .srow { border-top: 1px solid var(--line); }
.co + .srow { border-top: 0; }
.sno { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--f-num); font-weight: 600; font-size: 14px; margin-bottom: 10px; }
.srow.skip .sno { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.delrow { width: 40px; height: 50px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.delrow:hover { color: var(--err); border-color: var(--err); }
.sres { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; background: var(--out-bg); border: 1px solid var(--out-line); color: var(--out-ink); border-radius: 8px; padding: 6px 10px; }
.sres:empty { display: none; }
.sres .t { font-family: var(--f-num); font-weight: 600; font-size: 18px; color: var(--out-strong); }
.sres .w { font-size: 13px; }
.sres .w b { font-family: var(--f-num); }
.sres.note { background: transparent; border-style: dashed; border-color: var(--line); color: var(--muted); font-size: 13px; }
.sres.note.e { color: var(--err); border-color: var(--err); }
.co { margin-left: 42px; font-size: 12px; color: var(--muted); padding: 2px 0 2px 12px; border-left: 3px dotted var(--accent); }
.co b { font-family: var(--f-num); color: var(--accent); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { min-height: 56px; border-radius: 10px; border: 1.5px solid var(--in-line); background: var(--in-bg); color: var(--in-ink); font-family: var(--f-num); font-size: 22px; font-weight: 600; cursor: pointer; }
.seg button small { font-family: var(--f-ui); font-size: 13px; margin-left: 2px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.box.fixed { background: transparent; box-shadow: none; border-style: dashed; }
.fhead { display: grid; gap: 2px; }
.fhead h2 { font-size: 15px; color: var(--muted); letter-spacing: .06em; }
.fnote { font-size: 12px; color: var(--muted); }
.fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fields.three .ctl input { font-size: 18px; padding-inline: 8px; }
.fields.three .ctl .unit { padding: 0 6px; font-size: 12px; }
.foot { display: flex; justify-content: center; padding-top: 4px; }

/* 終了時刻バー（生産予定） */
.endbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--out-bg); border-top: 1.5px solid var(--out-line); color: var(--out-ink); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
.endbar .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-block: 10px; }
.endbar b { font-family: var(--f-num); font-size: 26px; color: var(--out-strong); }

/* modal & toast */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 45%, transparent); padding: 16px; }
#modal { z-index: 60; }
.modal .dlg { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 18px; max-width: 440px; width: 100%; display: grid; gap: 14px; border: 1px solid var(--line); max-height: calc(100% - 32px); overflow: auto; }
.modal .dlg p { margin: 0; }
.modal .dlg h2 { font-size: 18px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal .stack { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

@media (max-width: 380px) {
  .hero .hv { font-size: 40px; }
  .tab { font-size: 14px; }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div>
      <h1>生産時間・残量計算</h1>
      <span class="saved" id="saved">入力はこの端末に自動保存されます</span>
    </div>
    <button class="btn sm" id="bk-open">バックアップ</button>
  </div>
</header>

<nav class="tabs" aria-label="画面切り替え">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="t-schedule" data-tab="schedule" aria-selected="true">① 予定時間</button>
    <button class="tab" role="tab" id="t-forecast" data-tab="forecast" aria-selected="false">② 終了予測</button>
    <button class="tab" role="tab" id="t-mass" data-tab="mass" aria-selected="false">③ 残量計算</button>
  </div>
</nav>

<main class="wrap">
  <!-- ① 生産予定時間 -->
  <section class="panel" id="p-schedule" role="tabpanel" aria-labelledby="t-schedule">
    <div class="hero" id="sc-hero"></div>

    <div class="box">
      <h2>共通の設定</h2>
      <div class="fields">
        <label class="field" for="sc-date"><span class="lbl">対象日</span>
          <span class="ctl" data-ctl="schedule.date"><input type="date" id="sc-date" data-tab="schedule" data-key="date"></span>
          <span class="err" data-err="schedule.date"></span></label>
        <label class="field" for="sc-startTime"><span class="lbl">最初の開始時刻</span>
          <span class="ctl" data-ctl="schedule.startTime"><input type="time" id="sc-startTime" data-tab="schedule" data-key="startTime" step="60"></span>
          <span class="err" data-err="schedule.startTime"></span></label>
        <label class="field" for="sc-shot"><span class="lbl">ショット数</span>
          <span class="ctl" data-ctl="schedule.shot"><input id="sc-shot" data-tab="schedule" data-key="shot" inputmode="decimal" autocomplete="off"><span class="unit">本/分</span></span>
          <span class="err" data-err="schedule.shot"></span></label>
        <label class="field" for="sc-changeover"><span class="lbl">切り替え時間</span>
          <span class="ctl" data-ctl="schedule.changeover"><input id="sc-changeover" data-tab="schedule" data-key="changeover" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">分</span></span>
          <span class="err" data-err="schedule.changeover"></span></label>
      </div>
      <p class="hint">ショット数は全行共通。切り替え時間は、生産する行と行の間だけ足します。</p>
    </div>

    <div class="box">
      <h2>生産の順番</h2>
      <div class="srows" id="sc-rows"></div>
      <button class="btn ghost wide" id="sc-add">＋ 行を追加</button>
      <p class="hint">数量が空欄・0の行は計算しません。</p>
    </div>
    <div class="foot"><button class="btn sm danger" data-reset="schedule">この画面の入力をすべて消す</button></div>
  </section>

  <!-- ② 終了時刻予測 -->
  <section class="panel" id="p-forecast" role="tabpanel" aria-labelledby="t-forecast" hidden>
    <div class="hero" id="fc-hero"></div>

    <div class="box">
      <div class="fields">
        <label class="field full" for="fc-counter"><span class="lbl">現在のカウンター本数</span>
          <span class="ctl big" data-ctl="forecast.counter"><input id="fc-counter" data-tab="forecast" data-key="counter" inputmode="numeric" autocomplete="off"><span class="unit">本</span></span>
          <span class="err" data-err="forecast.counter"></span></label>
        <label class="field full" for="fc-plan"><span class="lbl">製造予定数量</span>
          <span class="ctl" data-ctl="forecast.plan"><input id="fc-plan" data-tab="forecast" data-key="plan" inputmode="numeric" autocomplete="off"><span class="unit">本</span></span>
          <span class="err" data-err="forecast.plan"></span></label>
        <label class="field" for="fc-shot"><span class="lbl">ショット数</span>
          <span class="ctl" data-ctl="forecast.shot"><input id="fc-shot" data-tab="forecast" data-key="shot" inputmode="decimal" autocomplete="off"><span class="unit">本/分</span></span>
          <span class="err" data-err="forecast.shot"></span></label>
        <label class="field" for="fc-brk"><span class="lbl">これからの休憩</span>
          <span class="ctl" data-ctl="forecast.brk"><input id="fc-brk" data-tab="forecast" data-key="brk" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">分</span></span>
          <span class="err" data-err="forecast.brk"></span></label>
      </div>
    </div>
    <div class="foot"><button class="btn sm danger" data-reset="forecast">この画面の入力をすべて消す</button></div>
  </section>

  <!-- ③ 受入質量・残量計算 -->
  <section class="panel" id="p-mass" role="tabpanel" aria-labelledby="t-mass" hidden>
    <div class="hero" id="ms-hero"></div>

    <div class="box">
      <h2>毎回入れる値</h2>
      <div class="fields">
        <div class="field full"><span class="lbl">1本の錠数</span>
          <div class="seg" role="group" aria-label="1本の錠数">
            <button type="button" data-pb="60">60<small>錠</small></button><button type="button" data-pb="120">120<small>錠</small></button><button type="button" data-pb="240">240<small>錠</small></button>
          </div>
          <span class="err" data-err="mass.perBottle"></span></div>
        <label class="field full" for="ms-prevBottles"><span class="lbl">前日生産本数</span>
          <span class="ctl big" data-ctl="mass.prevBottles"><input id="ms-prevBottles" data-tab="mass" data-key="prevBottles" inputmode="numeric" autocomplete="off"><span class="unit">本</span></span>
          <span class="err" data-err="mass.prevBottles"></span></label>
        <label class="field full" for="ms-fraction"><span class="lbl">端数の質量（なければ0）</span>
          <span class="ctl" data-ctl="mass.fraction"><input id="ms-fraction" data-tab="mass" data-key="fraction" inputmode="decimal" autocomplete="off"><span class="unit">kg</span></span>
          <span class="err" data-err="mass.fraction"></span></label>
      </div>
    </div>
    <div class="box fixed">
      <div class="fhead"><h2>いつもの値</h2><span class="fnote">最初から入っています。変えるときだけ触ってください</span></div>
      <div class="fields three">
        <label class="field" for="ms-perBarrel"><span class="lbl">1タルの質量</span>
          <span class="ctl" data-ctl="mass.perBarrel"><input id="ms-perBarrel" data-tab="mass" data-key="perBarrel" inputmode="decimal" autocomplete="off" placeholder="100"><span class="unit">kg</span></span>

<script>
/* =====================================================================
 * 計算ロジック（画面処理から分離）
 * 元Excel「時間計算.xlsx」Sheet1 の数式を再現。
 * 時刻は JST(UTC+9) の epoch ミリ秒で保持し、途中で丸めない。
 * ===================================================================== */
(function (root) {
  'use strict';

  var MIN = 60000;               // 1分 [ms]
  var DAY = 86400000;            // 1日 [ms]
  var JST = 9 * 3600000;         // 日本時間オフセット [ms]

  /* ---------- 入力値の解釈 ---------- */

  // 全角数字・記号を半角へ、桁区切りカンマを除去
  function normalize(raw) {
    if (raw === null || raw === undefined) return '';
    return String(raw)
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[．。]/g, '.')
      .replace(/[－ー−]/g, '-')
      .replace(/[，,]/g, '')
      .replace(/[\s　]+/g, '');
  }

  /**
   * 数値欄を解釈する。空欄と明示的な0を区別する。
   * rule.kind  : 'int'（整数） | 'dec'（小数可）
   * rule.gt0   : true なら 0 より大きい値のみ
   * rule.min   : 下限（含む）。既定 0
   * rule.empty : 空欄時に使う値（休憩・切り替え時間は 0）。未指定なら 'empty' 状態
   * 戻り値 { state:'empty'|'ok'|'error', value?, msg? }
   */
  function parseField(raw, rule) {
    rule = rule || {};
    var s = normalize(raw);
    if (s === '') {
      if (rule.empty !== undefined) return { state: 'ok', value: rule.empty, defaulted: true };
      return { state: 'empty' };
    }
    var re = rule.kind === 'int' ? /^-?\d+$/ : /^-?(\d+(\.\d*)?|\.\d+)$/;
    if (!re.test(s)) {
      return { state: 'error', msg: rule.kind === 'int' ? '整数で入力してください' : '数値で入力してください' };
    }
    var v = Number(s);
    if (!isFinite(v)) return { state: 'error', msg: '数値で入力してください' };
    if (v < 0) return { state: 'error', msg: 'マイナスは入力できません' };
    if (rule.gt0 && !(v > 0)) return { state: 'error', msg: '0より大きい数値を入力してください' };
    var min = rule.min === undefined ? 0 : rule.min;
    if (v < min) return { state: 'error', msg: min + '以上で入力してください' };
    return { state: 'ok', value: v };
  }

  var RULES = {
    shot:     { kind: 'dec', gt0: true },          // ショット数／分
    qty:      { kind: 'int', min: 0 },             // 数量・本数
    minutes:  { kind: 'dec', min: 0, empty: 0 },   // 休憩・切り替え（空欄=0分）
    kg:       { kind: 'dec', min: 0 },             // 質量 kg
    count:    { kind: 'int', min: 0 },             // タル数
    perBottle:{ kind: 'int', min: 1 },             // 1本あたり錠数（1以上）
    tabMass:  { kind: 'dec', gt0: true }           // 1錠あたり質量 g（0より大）
  };

  // 'YYYY-MM-DD' → 当日0:00(JST) の epoch ms。不正なら null
  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var t = Date.UTC(y, mo - 1, d);
    var chk = new Date(t);
    if (chk.getUTCFullYear() !== y || chk.getUTCMonth() !== mo - 1 || chk.getUTCDate() !== d) return null;
    return t - JST;
  }

  // 'HH:MM' → 0:00 からの分。不正なら null
  function parseTime(s) {
    var m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(normalize(s).replace('：', ':'));
    if (!m) return null;
    var h = +m[1], mi = +m[2], se = m[3] ? +m[3] : 0;
    if (h > 23 || mi > 59 || se > 59) return null;
    return h * 60 + mi + se / 60;
  }

  /* ---------- ① 生産予定時間 ---------- */

  /**
   * 元セル（Sheet1）:
   *   E4 = D4/$B$3/1440        作業時間（Excel日単位）
   *   H4 = G4+E4+I4            終了 = 開始 + 作業時間 + 休憩
   *   G5 = H4+$B$4             次行開始 = 前行終了 + 切り替え時間
   *   E5 = D5/$B$3/1440, H5 = G5+E5+I5 … 以降同様
   * Web版:
   *   作業時間[分] = 製造予定数量 ÷ ショット数/分     （÷1440 は日単位変換なので不要）
   *   1行目開始 = 対象日 + 開始時刻
   *   2行目以降の開始 = 直前の「有効な行」の終了 + 切り替え時間
   *   終了 = 開始 + 作業時間 + その行の休憩
   *   改善: 数量が空欄/0の行は対象外。切り替えは有効行の間だけ。最後の後には加算しない。
   */
  function calcSchedule(inp) {
    var f = {
      date: inp.date ? (parseDate(inp.date) === null ? { state: 'error', msg: '日付が正しくありません' } : { state: 'ok', value: parseDate(inp.date) }) : { state: 'empty' },
      startTime: inp.startTime ? (parseTime(inp.startTime) === null ? { state: 'error', msg: '時刻が正しくありません' } : { state: 'ok', value: parseTime(inp.startTime) }) : { state: 'empty' },
      shot: parseField(inp.shot, RULES.shot),
      changeover: parseField(inp.changeover, RULES.minutes)
    };
    var commonOk = f.date.state === 'ok' && f.startTime.state === 'ok' && f.shot.state === 'ok' && f.changeover.state === 'ok';
    var commonErr = ['date', 'startTime', 'shot', 'changeover'].some(function (k) { return f[k].state === 'error'; });

    var shot = commonOk ? f.shot.value : null;
    var co = commonOk ? f.changeover.value : null;
    var cursor = commonOk ? f.date.value + f.startTime.value * MIN : null; // 次の開始候補 [ms]
    var prevEnd = null;
    var blocked = false;
    var tot = { qty: 0, workMin: 0, brkMin: 0, changeMin: 0, count: 0, endMs: null };

    var rows = (inp.rows || []).map(function (r) {
      var q = parseField(r.qty, RULES.qty);
      var b = parseField(r.brk, RULES.minutes);
      var out = { qty: q, brk: b };
      if (q.state === 'error' || b.state === 'error') { out.state = 'error'; blocked = true; return out; }
      if (q.state === 'empty' || q.value === 0) { out.state = 'skip'; return out; } // 計算対象外
      tot.qty += q.value; tot.count += 1; tot.brkMin += b.value;
      if (!commonOk) { out.state = commonErr ? 'blocked' : 'pending'; return out; }
      if (blocked) { out.state = 'blocked'; return out; }
      var work = q.value / shot;                         // E列: D/$B$3（分）
      var start = prevEnd === null ? cursor : prevEnd + co * MIN; // G列: H(前)+$B$4
      if (prevEnd !== null) tot.changeMin += co;
      var end = start + (work + b.value) * MIN;          // H列: G+E+I
      prevEnd = end;
      tot.workMin += work;
      out.state = 'ok'; out.workMin = work; out.brkMin = b.value; out.startMs = start; out.endMs = end;
      return out;
    });

    var hasRowErr = rows.some(function (r) { return r.state === 'error'; });
    var status;
    if (commonErr || hasRowErr) status = 'error';
    else if (!commonOk) status = 'incomplete';
    else if (tot.count === 0) status = 'norows';
    else status = 'ok';
    if (status === 'ok') tot.endMs = prevEnd;
    if (!commonOk || hasRowErr) { tot.workMin = commonOk ? tot.workMin : null; }
    if (!commonOk) tot.changeMin = null;

    return { status: status, fields: f, rows: rows, totals: tot, baseDayMs: f.date.state === 'ok' ? f.date.value : null };
  }

  /* ---------- ② 終了時刻予測 ---------- */

  /**
   * 元セル:
   *   F14 = IF(D14="","",D14-E14)            残本数
   *   G14 = F14/$G$13/1440                   残り作業時間（Excel日単位）
   *   H14 = IF(D14="","",NOW()+G14+G15)      終了予定 = 現在 + 残作業 + 休憩
   * Web版: NOW() は「計算基準日時 baseMs」（入力変更時 or ボタン押下時）に置き換える。
   */
  function calcForecast(inp) {
    var f = {
      plan: parseField(inp.plan, RULES.qty),
      counter: parseField(inp.counter, RULES.qty),
      shot: parseField(inp.shot, RULES.shot),
      brk: parseField(inp.brk, RULES.minutes)
    };
    var keys = ['plan', 'counter', 'shot', 'brk'];
    if (keys.some(function (k) { return f[k].state === 'error'; })) return { status: 'error', fields: f };
    if (keys.some(function (k) { return f[k].state === 'empty'; })) return { status: 'incomplete', fields: f };

    var remaining = f.plan.value - f.counter.value;               // F14
    if (remaining < 0) return { status: 'over', fields: f, remaining: remaining, over: -remaining };
    if (remaining === 0) return { status: 'done', fields: f, remaining: 0, workMin: 0, totalMin: 0 };

    var workMin = remaining / f.shot.value;                       // G14 ×1440
    var totalMin = workMin + f.brk.value;                         // G14+G15
    var base = typeof inp.baseMs === 'number' && isFinite(inp.baseMs) ? inp.baseMs : null;
    return {
      status: 'ok', fields: f, remaining: remaining, workMin: workMin, totalMin: totalMin,
      baseMs: base, endMs: base === null ? null : base + totalMin * MIN   // H14
    };
  }

  /* ---------- ③ 受入質量・残量計算 ---------- */

  /**
   * 元セル（クラシエ受け入れ質量計算）:
   *   I19 = (B19*C19+D19)-(E19*F19/1000*G19)   残りKg数
   *   J19 = I19/(F19/1000)                     残り錠数
   */
  function calcMass(inp) {
    var f = {
      perBarrel: parseField(inp.perBarrel, RULES.kg),       // B19
      barrels: parseField(inp.barrels, RULES.count),        // C19
      fraction: parseField(inp.fraction, RULES.kg),         // D19
      perBottle: parseField(inp.perBottle, RULES.perBottle),// E19
      tabMass: parseField(inp.tabMass, RULES.tabMass),      // F19
      prevBottles: parseField(inp.prevBottles, RULES.qty)   // G19
    };
    var keys = Object.keys(f);
    var out = { fields: f };
    if (keys.some(function (k) { return f[k].state === 'error'; })) { out.status = 'error'; }
    else if (keys.some(function (k) { return f[k].state === 'empty'; })) { out.status = 'incomplete'; }
    else out.status = 'ok';

    var v = function (k) { return f[k].state === 'ok' ? f[k].value : null; };
    if (v('perBarrel') !== null && v('barrels') !== null && v('fraction') !== null)
      out.receivedKg = v('perBarrel') * v('barrels') + v('fraction');                 // B19*C19+D19
    if (v('perBottle') !== null && v('tabMass') !== null && v('prevBottles') !== null)
      out.usedKg = v('perBottle') * v('tabMass') / 1000 * v('prevBottles');           // E19*F19/1000*G19
    if (out.status === 'ok') {
      out.remainKg = out.receivedKg - out.usedKg;                                     // I19
      out.remainTabs = out.remainKg / (v('tabMass') / 1000);                          // J19
      out.negative = out.remainKg < 0;
    }
    return out;
  }

  /* ---------- 製品別参考設定: ショット数表記の解釈 ---------- */
  // '34' → 単一値, '15~18' '26～27' → 範囲（平均は採用しない）
  function parseShotText(t) {
    var s = normalize(t).replace(/[〜～~]/g, '~');
    if (s === '') return { type: 'none' };
    if (/^\d+(\.\d+)?$/.test(s)) { var n = Number(s); return n > 0 ? { type: 'single', value: n } : { type: 'invalid' }; }
    var m = /^(\d+(?:\.\d+)?)~(\d+(?:\.\d+)?)$/.exec(s);
    if (m) return { type: 'range', min: Number(m[1]), max: Number(m[2]) };
    return { type: 'invalid' };
  }

  /* ---------- 表示用の整形（計算値は丸めず、ここでだけ整える） ---------- */

  function fin(x) { return typeof x === 'number' && isFinite(x); }

  // 分 → 「26時間15分」（24hで折り返さない）。withSec で秒まで
  function fmtDuration(min, withSec) {
    if (!fin(min)) return '—';
    var neg = min < 0; var sec = Math.round(Math.abs(min) * 60);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var str;
    if (withSec) str = (h ? h + '時間' : '') + (h || m ? m + '分' + pad(s) : s) + '秒';
    else str = h ? h + '時間' + m + '分' : m + '分';
    return (neg ? '−' : '') + str;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // epoch ms → JST の部品（秒は四捨五入してから桁を決める）
  function jstParts(ms) {
    var t = Math.round(ms / 1000) * 1000 + JST;
    var d = new Date(t);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds(), wd: d.getUTCDay(), dayIdx: Math.floor(t / DAY) };
  }

  // 時刻表示。baseDayMs（対象日0:00）からの日数差で「翌日」等を付ける
  function fmtClock(ms, baseDayMs, withSec) {
    if (!fin(ms)) return '—';
    var p = jstParts(ms);
    var hm = pad(p.h) + ':' + pad(p.mi) + (withSec ? ':' + pad(p.s) : '');
    if (!fin(baseDayMs)) return hm;
    var diff = p.dayIdx - Math.floor((baseDayMs + JST) / DAY);
    if (diff === 0) return hm;
    if (diff === 1) return '翌日 ' + hm;
    if (diff === -1) return '前日 ' + hm;
    return p.mo + '/' + p.d + '（' + diff + '日後） ' + hm;
  }

  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function fmtDateTime(ms, withSec) {
    if (!fin(ms)) return '—';
    var p = jstParts(ms);
    return p.y + '/' + pad(p.mo) + '/' + pad(p.d) + '（' + WD[p.wd] + '） ' + pad(p.h) + ':' + pad(p.mi) + (withSec ? ':' + pad(p.s) : '');
  }

  function fmtNum(x, digits) {
    if (!fin(x)) return '—';
    digits = digits || 0;
    var r = Number(x.toFixed(digits));
    if (r === 0) r = 0; // -0 を避ける
    return r.toLocaleString('ja-JP', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function todayJST(nowMs) {
    var p = jstParts(nowMs === undefined ? Date.now() : nowMs);
    return p.y + '-' + pad(p.mo) + '-' + pad(p.d);
  }

  var Calc = {
    MIN: MIN, DAY: DAY, JST: JST, RULES: RULES,
    normalize: normalize, parseField: parseField, parseDate: parseDate, parseTime: parseTime,
    calcSchedule: calcSchedule, calcForecast: calcForecast, calcMass: calcMass, parseShotText: parseShotText,
    fmtDuration: fmtDuration, fmtClock: fmtClock, fmtDateTime: fmtDateTime, fmtNum: fmtNum, todayJST: todayJST, jstParts: jstParts
  };
  root.Calc = Calc;
  if (typeof module !== 'undefined' && module.exports) module.exports = Calc;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var C = window.Calc;
  var KEY = 'seisan-keisan-v1';

  /* ---------- 状態 ---------- */
  function blankRows(n) { var r = []; for (var i = 0; i < n; i++) r.push({ qty: '', brk: '' }); return r; }
  var MASS_DEF = { perBarrel: '100', barrels: '3', tabMass: '0.4' };
  var PB_LIST = ['60', '120', '240'];
  var BLANK = {
    schedule: function () { return { date: C.todayJST(), shot: '', changeover: '', startTime: '', rows: blankRows(7) }; },
    forecast: function () { return { plan: '', counter: '', shot: '', brk: '', baseMs: null, restored: false }; },
    mass: function () { return { perBarrel: MASS_DEF.perBarrel, barrels: MASS_DEF.barrels, fraction: '', perBottle: '120', tabMass: MASS_DEF.tabMass, prevBottles: '' }; }
  };
  // 旧版のサンプル値がそのまま残っていたら空欄に戻す
  function isOldSample(tab, d) {
    if (!d) return false;
    if (tab === 'schedule') return d.shot === '41' && d.changeover === '20' && d.startTime === '12:00' && d.rows && d.rows[0] && d.rows[0].qty === '3018' && d.rows[1] && d.rows[1].qty === '6625' && d.rows[2] && d.rows[2].qty === '1000' && d.rows.slice(3).every(function (r) { return !r.qty; });
    if (tab === 'forecast') return d.plan === '7932' && d.counter === '3200' && d.shot === '37' && d.brk === '15';
    return d.perBarrel === '100' && d.barrels === '3' && d.fraction === '78.35' && d.perBottle === '120' && d.tabMass === '0.4' && d.prevBottles === '5203';
  }
  function fresh() { return { v: 1, tab: 'schedule', showSec: false, schedule: BLANK.schedule(), forecast: BLANK.forecast(), mass: BLANK.mass(), backupAt: null }; }
  function normalizeState(s) {
    var out = fresh();
    if (!s || typeof s !== 'object') return out;
    out.tab = ['schedule', 'forecast', 'mass'].indexOf(s.tab) >= 0 ? s.tab : 'schedule';
    out.showSec = !!s.showSec;
    out.backupAt = typeof s.backupAt === 'number' ? s.backupAt : null;
    ['schedule', 'forecast', 'mass'].forEach(function (t) {
      var d = s[t];
      if (!d || (s.sample && s.sample[t] && isOldSample(t, d))) return;
      out[t] = Object.assign(BLANK[t](), d);
    });
    out.schedule.rows = (Array.isArray(out.schedule.rows) && out.schedule.rows.length ? out.schedule.rows : blankRows(7))
      .map(function (r) { return { qty: r && r.qty != null ? String(r.qty) : '', brk: r && r.brk != null ? String(r.brk) : '' }; });
    Object.keys(MASS_DEF).forEach(function (k) { if (out.mass[k] === '' || out.mass[k] == null) out.mass[k] = MASS_DEF[k]; });
    if (PB_LIST.indexOf(String(out.mass.perBottle)) < 0) out.mass.perBottle = '120';
    out.mass.perBottle = String(out.mass.perBottle);
    if (typeof out.forecast.baseMs === 'number') out.forecast.restored = true;
    return out;
  }

  /* ---------- 保存（この端末のlocalStorage） ---------- */
  var state, saveOk = true;
  function load() {
    try { var raw = localStorage.getItem(KEY); return normalizeState(raw ? JSON.parse(raw) : null); }
    catch (e) { saveOk = false; return fresh(); }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      saveOk = true;
      var p = C.jstParts(Date.now());
      $('#saved').innerHTML = '<b>✓ 保存済み</b> ' + pad(p.h) + ':' + pad(p.mi) + '（この端末）';
    } catch (e) {
      saveOk = false;
      $('#saved').textContent = '保存できません（プライベートモード等）。バックアップを使ってください';
    }
  }
  // ホームに戻る・アプリ切替の瞬間にも念のため保存
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);
  // ブラウザに「この保存データを勝手に消さないで」と依頼（対応端末のみ）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

  /* ---------- 小物 ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function stat(k, v, unit, d) { return '<div class="stat"><span class="k">' + k + '</span><span class="v">' + v + (unit && v !== '—' ? '<small>' + unit + '</small>' : '') + '</span>' + (d ? '<span class="d">' + d + '</span>' : '') + '</div>'; }
  function secToggle() { return '<label class="toggle"><input type="checkbox" class="sec-toggle"' + (state.showSec ? ' checked' : '') + '>秒まで表示</label>'; }
  function setFieldError(path, r) {
    var ctl = $('[data-ctl="' + path + '"]'), err = $('[data-err="' + path + '"]'), bad = r && r.state === 'error';
    if (ctl) ctl.classList.toggle('bad', bad);
    if (err) err.textContent = bad ? r.msg : '';
  }
  var toastTimer;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }
  var modalOk = null;
  function confirmBox(msg, okLabel, fn) { $('#modal-msg').textContent = msg; $('#modal-ok').textContent = okLabel || '実行する'; modalOk = fn; $('#modal').hidden = false; $('#modal-cancel').focus(); }
  function closeModal() { $('#modal').hidden = true; modalOk = null; }
  function flash(el) { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  function sec() { return state.showSec; }

  /* ---------- ① 生産予定時間 ---------- */
  function renderRows() {
    $('#sc-rows').innerHTML = state.schedule.rows.map(function (r, i) {
      return '<div class="co" id="co-' + i + '" hidden></div>' +
        '<div class="srow" id="sr-' + i + '">' +
        '<span class="sno">' + (i + 1) + '</span>' +
        '<label class="field" for="sr-qty-' + i + '"><span class="lbl">製造予定数量</span><span class="ctl" data-ctl="row' + i + '.qty"><input id="sr-qty-' + i + '" data-row="' + i + '" data-key="qty" inputmode="numeric" autocomplete="off" value="' + esc(r.qty) + '"><span class="unit">本</span></span><span class="err" data-err="row' + i + '.qty"></span></label>' +
        '<label class="field" for="sr-brk-' + i + '"><span class="lbl">休憩</span><span class="ctl" data-ctl="row' + i + '.brk"><input id="sr-brk-' + i + '" data-row="' + i + '" data-key="brk" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(r.brk) + '"><span class="unit">分</span></span><span class="err" data-err="row' + i + '.brk"></span></label>' +
        '<button class="delrow" data-del="' + i + '" aria-label="' + (i + 1) + '行目を削除" title="この行を削除">×</button>' +
        '<div class="sres" id="so-' + i + '"></div>' +
        '</div>';
    }).join('');
  }

  var schedStatus = null, schedEnd = '';
  function updateSchedule() {
    var r = C.calcSchedule(state.schedule), base = r.baseDayMs, s = sec(), seenOk = false;
    ['date', 'startTime', 'shot', 'changeover'].forEach(function (k) { setFieldError('schedule.' + k, r.fields[k]); });
    r.rows.forEach(function (row, i) {
      setFieldError('row' + i + '.qty', row.qty); setFieldError('row' + i + '.brk', row.brk);
      var el = $('#so-' + i), co = $('#co-' + i), rowEl = $('#sr-' + i); if (!el) return;
      rowEl.classList.toggle('skip', row.state === 'skip');
      el.className = 'sres';
      co.hidden = true;
      if (row.state === 'ok') {
        if (seenOk && r.fields.changeover.value > 0) { co.hidden = false; co.innerHTML = '切り替え <b>' + C.fmtDuration(r.fields.changeover.value, false) + '</b>'; }
        seenOk = true;
        el.innerHTML = '<span class="t">' + C.fmtClock(row.startMs, base, s) + ' → ' + C.fmtClock(row.endMs, base, s) + '</span>' +
          '<span class="w">作業 <b>' + C.fmtDuration(row.workMin, s) + '</b>' + (s ? '（' + C.fmtNum(row.workMin, 6) + '分）' : '') + (row.brkMin ? '＋休憩 <b>' + C.fmtNum(row.brkMin, row.brkMin % 1 ? 1 : 0) + '分</b>' : '') + '</span>';
      } else if (row.state === 'skip') el.innerHTML = '';
      else if (row.state === 'pending') { el.className = 'sres note'; el.textContent = '上の「共通の設定」を入れると計算します'; }
      else if (row.state === 'blocked') { el.className = 'sres note e'; el.textContent = '赤い欄を直すと計算します'; }
      else { el.className = 'sres note e'; el.textContent = 'この行の入力を確認してください'; }
    });

    var t = r.totals, h = '';
    schedStatus = r.status;
    if (r.status === 'ok') {
      var ep = C.jstParts(t.endMs), endTxt = C.fmtClock(t.endMs, base, s), m = /^(.*\S)\s+(\d\d:\d\d(?::\d\d)?)$/.exec(endTxt);
      schedEnd = endTxt;
      h = '<div class="hhead"><span class="hk">最終終了予定</span>' + secToggle() + '</div>' +
        '<div class="hv">' + (m ? '<span class="pre">' + esc(m[1]) + '</span>' + m[2] : endTxt) + '</div>' +
        '<div class="hd">' + ep.mo + '/' + ep.d + '・生産 <b>' + t.count + '</b> 件</div>' +
        '<div class="stats">' +
        stat('合計数量', C.fmtNum(t.qty, 0), '本') +
        stat('合計作業時間', C.fmtDuration(t.workMin, s), '', s ? C.fmtNum(t.workMin, 6) + '分' : '') +
        stat('合計休憩', C.fmtDuration(t.brkMin, s)) +
        stat('合計切り替え', C.fmtDuration(t.changeMin, s), '', Math.max(0, t.count - 1) + '回') +
        '</div>';
      $('#sc-hero').className = 'hero';
    } else {
      var msg = r.status === 'error' ? ['入力エラー', '赤い欄を確認してください'] :
        r.status === 'norows' ? ['未入力', '「生産の順番」に製造予定数量を入れてください'] :
        ['未入力', '最初の開始時刻とショット数を入れると計算します'];
      h = '<div class="hhead"><span class="hk">最終終了予定</span></div><div class="hv">' + msg[0] + '</div><div class="hd">' + msg[1] + '</div>';
      $('#sc-hero').className = 'hero ' + (r.status === 'error' ? 'err' : 'idle');
      schedEnd = '';
    }
    $('#sc-hero').innerHTML = h;
    $('#endbar-v').textContent = schedEnd;
    updateEndbar();
  }

  // 終了予定が画面外に出たら下にバーを出す
  var heroVisible = true;
  function updateEndbar() { $('#endbar').hidden = !(state.tab === 'schedule' && schedStatus === 'ok' && !heroVisible); }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { heroVisible = es[0].isIntersecting; updateEndbar(); }, { rootMargin: '-60px 0px 0px 0px' }).observe($('#sc-hero'));
  }

  /* ---------- ② 終了時刻予測 ---------- */
  function updateForecast() {
    var st = state.forecast, r = C.calcForecast(st), s = sec(), h = '', cls = 'hero';
    ['plan', 'counter', 'shot', 'brk'].forEach(function (k) { setFieldError('forecast.' + k, r.fields[k]); });
    var baseLine = typeof st.baseMs === 'number'
      ? '<div class="base"><span>' + C.fmtDateTime(st.baseMs, true).replace(/^\d{4}\//, '') + ' 時点<span class="tag' + (st.restored ? ' old">前回の計算' : '">今回の計算') + '</span></span><button class="btn sm primary" id="fc-now">今の時刻で再計算</button></div>'
      : '';
    if (r.status === 'ok') {
      var endTxt = C.fmtClock(r.endMs, st.baseMs, s), m = /^(.*\S)\s+(\d\d:\d\d(?::\d\d)?)$/.exec(endTxt);
      h = '<div class="hhead"><span class="hk">終了予定</span>' + secToggle() + '</div>' +
        '<div class="hv">' + (m ? '<span class="pre">' + esc(m[1]) + '</span>' + m[2] : endTxt) + '</div>' +
        '<div class="hd">あと <b>' + C.fmtDuration(r.totalMin, s) + '</b>' + (r.fields.brk.value ? '（休憩 ' + C.fmtNum(r.fields.brk.value, r.fields.brk.value % 1 ? 1 : 0) + '分込み）' : '') + '</div>' +
        '<div class="stats">' + stat('残本数', C.fmtNum(r.remaining, 0), '本') + stat('残り作業時間', C.fmtDuration(r.workMin, s), '', s ? C.fmtNum(r.workMin, 6) + '分（休憩なし）' : '休憩なし') + '</div>' + baseLine;
    } else if (r.status === 'done') {
      cls = 'hero ok';
      h = '<div class="hhead"><span class="hk">終了予定</span></div><div class="hv">生産完了</div><div class="hd">カウンター本数が製造予定数量に達しました</div>';
    } else if (r.status === 'over') {
      cls = 'hero err';
      h = '<div class="hhead"><span class="hk">終了予定</span></div><div class="hv">' + C.fmtNum(r.over, 0) + '<small>本 超過</small></div><div class="hd">カウンター本数か製造予定数量を確認してください</div>';
    } else {
      cls = 'hero ' + (r.status === 'error' ? 'err' : 'idle');
      h = '<div class="hhead"><span class="hk">終了予定</span></div><div class="hv">' + (r.status === 'error' ? '入力エラー' : '未入力') + '</div><div class="hd">' + (r.status === 'error' ? '赤い欄を確認してください' : 'カウンター本数・製造予定数量・ショット数を入れると計算します') + '</div>';
    }
    $('#fc-hero').className = cls; $('#fc-hero').innerHTML = h;
  }

  /* ---------- ③ 受入質量・残量 ---------- */
  function updateMass() {
    // 前日生産本数が空欄なら、いったん0本（使用質量0）として計算する
    var noPrev = C.normalize(state.mass.prevBottles) === '';
    var r = C.calcMass(noPrev ? Object.assign({}, state.mass, { prevBottles: '0' }) : state.mass), h = '', cls = 'hero';
    Object.keys(r.fields).forEach(function (k) { setFieldError('mass.' + k, r.fields[k]); });
    var stats = '<div class="stats">' + stat('受入総質量', C.fmtNum(r.receivedKg, 3), 'kg') + stat('前日の使用質量', C.fmtNum(r.usedKg, 3), 'kg') + '</div>';
    if (r.status === 'ok') {
      if (r.negative) cls = 'hero warn';
      h = (r.negative ? '<div class="alert">残りがマイナスです。入力を確認してください（値はそのまま表示しています）</div>' : '') +
        '<div class="pair"><div><div class="hk">残り質量</div><div class="hv">' + C.fmtNum(r.remainKg, 3) + '<small>kg</small></div></div>' +
        '<div><div class="hk">残り錠数</div><div class="hv">' + C.fmtNum(r.remainTabs, 0) + '<small>錠</small></div></div></div>' +
        (noPrev ? '<div class="alert">前日生産本数が未入力のため、受入質量そのままで計算しています</div>' : '') +
        '<div class="hd">錠数は質量からの換算値（理論値）です</div>' + stats;
    } else {
      cls = 'hero ' + (r.status === 'error' ? 'err' : 'idle');
      h = '<div class="hhead"><span class="hk">残り質量・残り錠数</span></div><div class="hv">' + (r.status === 'error' ? '入力エラー' : '未入力') + '</div><div class="hd">' + (r.status === 'error' ? '赤い欄を確認してください' : '端数の質量を入れると計算します') + '</div>';
    }
    $('#ms-hero').className = cls; $('#ms-hero').innerHTML = h;
  }

  /* ---------- バックアップ ---------- */
  function stamp(ms) { var p = C.jstParts(ms); return p.y + pad(p.mo) + pad(p.d) + '-' + pad(p.h) + pad(p.mi); }
  function showBkLast() { $('#bk-last').textContent = state.backupAt ? '最後にバックアップを保存した日時：' + C.fmtDateTime(state.backupAt) : 'まだバックアップは保存されていません。'; }
  function backupSave() {
    var now = Date.now();
    var data = { app: 'seisan-keisan', v: 1, savedAt: now, data: { schedule: state.schedule, forecast: state.forecast, mass: state.mass, showSec: state.showSec } };
    var json = JSON.stringify(data, null, 1), name = 'seisan-backup-' + stamp(now) + '.json';
    var blob = new Blob([json], { type: 'application/json' });
    var done = function () { state.backupAt = now; save(); showBkLast(); toast('バックアップを保存しました'); };
    var file = null;
    try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      // スマホ：共有メニューから「ファイルに保存」やLINEの自分宛てなどへ
      navigator.share({ files: [file], title: name }).then(done).catch(function (e) { if (e && e.name !== 'AbortError') download(); });
    } else download();
    function download() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); done();
    }
  }
  function backupLoad(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var obj; try { obj = JSON.parse(fr.result); } catch (e) { obj = null; }
      if (!obj || obj.app !== 'seisan-keisan' || !obj.data) { toast('このファイルはバックアップではありません'); return; }
      confirmBox(C.fmtDateTime(obj.savedAt) + ' のバックアップで、今の入力内容を置き換えます。よろしいですか？', '戻す', function () {
        var keepTab = state.tab, keepBk = state.backupAt;
        state = normalizeState(Object.assign({ tab: keepTab, backupAt: keepBk }, obj.data));
        ['schedule', 'forecast', 'mass'].forEach(fillInputs); updateAll(); save();
        $('#bk').hidden = true; toast('バックアップから戻しました');
      });
    };
    fr.readAsText(file);
  }

  /* ---------- 画面全体 ---------- */
  function touchForecast() { state.forecast.baseMs = Date.now(); state.forecast.restored = false; }
  function fillInputs(tab) {
    $all('[data-tab="' + tab + '"][data-key]').forEach(function (el) { if (el.tagName === 'INPUT') el.value = state[tab][el.getAttribute('data-key')] || ''; });
    if (tab === 'schedule') renderRows();
    if (tab === 'mass') syncSeg();
  }
  function syncSeg() { $all('[data-pb]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-pb') === state.mass.perBottle ? 'true' : 'false'); }); }
  function updateAll() { updateSchedule(); updateForecast(); updateMass(); }
  function setTab(tab) {
    state.tab = tab;
    $all('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false'); });
    ['schedule', 'forecast', 'mass'].forEach(function (t) { $('#p-' + t).hidden = t !== tab; });
    updateEndbar(); save();
  }

  document.addEventListener('input', function (e) {
    var el = e.target, tab = el.getAttribute('data-tab'), key = el.getAttribute('data-key'), row = el.getAttribute('data-row');
    if (row !== null && key) { state.schedule.rows[+row][key] = el.value; updateSchedule(); save(); return; }
    if (tab && key) {
      state[tab][key] = el.value;
      if (tab === 'forecast') { touchForecast(); updateForecast(); }
      else if (tab === 'schedule') updateSchedule(); else updateMass();
      save();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('sec-toggle')) { state.showSec = e.target.checked; updateSchedule(); updateForecast(); save(); }
    if (e.target.id === 'bk-file' && e.target.files && e.target.files[0]) { backupLoad(e.target.files[0]); e.target.value = ''; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); $('#bk').hidden = true; } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var a;
    if ((a = b.getAttribute('data-tab')) && b.classList.contains('tab')) { setTab(a); window.scrollTo(0, 0); return; }
    if ((a = b.getAttribute('data-reset'))) {
      var nm = { schedule: '① 予定時間', forecast: '② 終了予測', mass: '③ 残量計算' }[a];
      confirmBox('「' + nm + '」の入力を消します' + (a === 'mass' ? '（1タル100kg・3タル・1錠0.4g・120錠に戻ります）' : '') + '。よろしいですか？', '消す', function () { state[a] = BLANK[a](); fillInputs(a); updateAll(); save(); toast('入力を消しました'); });
      return;
    }
    if (b.id === 'modal-ok') { var fn = modalOk; closeModal(); if (fn) fn(); return; }
    if (b.id === 'modal-cancel') { closeModal(); return; }
    if (b.id === 'sc-add') { state.schedule.rows.push({ qty: '', brk: '' }); renderRows(); updateSchedule(); save(); var last = $('#sr-qty-' + (state.schedule.rows.length - 1)); if (last) last.focus(); return; }
    if ((a = b.getAttribute('data-del')) !== null) {
      var i = +a, r = state.schedule.rows[i];
      var doDel = function () { state.schedule.rows.splice(i, 1); if (!state.schedule.rows.length) state.schedule.rows.push({ qty: '', brk: '' }); renderRows(); updateSchedule(); save(); };
      if (r.qty || r.brk) confirmBox((i + 1) + '行目を削除します。よろしいですか？', '削除する', doDel); else doDel();
      return;
    }
    if (b.id === 'fc-now') { touchForecast(); updateForecast(); save(); toast('今の時刻で再計算しました'); flash($('#fc-hero')); return; }
    if ((a = b.getAttribute('data-pb'))) { state.mass.perBottle = a; syncSeg(); updateMass(); save(); return; }
    if (b.id === 'ms-defaults') { Object.keys(MASS_DEF).forEach(function (k) { state.mass[k] = MASS_DEF[k]; }); fillInputs('mass'); updateMass(); save(); toast('いつもの値に戻しました'); return; }
    if (b.id === 'bk-open') { showBkLast(); $('#bk').hidden = false; return; }
    if (b.id === 'bk-close') { $('#bk').hidden = true; return; }
    if (b.id === 'bk-save') { backupSave(); return; }
    if (b.id === 'bk-load') { $('#bk-file').click(); return; }
  });
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
  $('#bk').addEventListener('click', function (e) { if (e.target.id === 'bk') $('#bk').hidden = true; });

  /* ---------- 起動 ---------- */
  state = load();
  ['schedule', 'forecast', 'mass'].forEach(fillInputs);
  updateAll(); setTab(state.tab);
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
